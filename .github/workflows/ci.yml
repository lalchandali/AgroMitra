name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgroMitra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AgroMitra/backend/test-requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/test-requirements.txt
      - name: Run backend tests
        run: python -m pytest -q backend/tests

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgroMitra/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AgroMitra/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
